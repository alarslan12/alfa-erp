name: ALFA ERP V6.2 independent Windows installer release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: contains(github.event.head_commit.message, '[v620-build]')
    name: Verified clean Windows installer build
    runs-on: windows-2025
    timeout-minutes: 55
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
      - name: Install tests dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check project completeness
        run: python KONTROL_DOSYA_UYUMU.py
      - name: Windows GUI and offline protocol tests (120 second hang watchdog)
        shell: pwsh
        run: |
          python -u -c "import faulthandler,unittest,sys; faulthandler.dump_traceback_later(120,exit=True); result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests')); sys.exit(not result.wasSuccessful())"
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup missing' }
      - name: Build owner Setup.exe
        shell: pwsh
        run: .\ALFA_BUILD_WINDOWS.ps1 -Edition yonetici
      - name: Build staff Setup.exe and notification agent
        shell: pwsh
        run: .\ALFA_BUILD_WINDOWS.ps1 -Edition personel
      - name: Validate both packed EXE startup self-tests
        shell: pwsh
        run: |
          $apps = @(
            @('dist\AlfaERPYonetici\AlfaERPYonetici.exe','owner'),
            @('dist\AlfaERP\AlfaERP.exe','staff')
          )
          foreach ($app in $apps) {
            $exe = Join-Path $env:GITHUB_WORKSPACE $app[0]
            $report = Join-Path $env:RUNNER_TEMP "alfa_smoke_$($app[1]).json"
            $env:ALFA_SMOKE_RESULT_PATH = $report
            $proc = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru
            try {
              if (-not $proc.WaitForExit(90000)) { throw "EXE timed out: $exe" }
              if ($proc.ExitCode -ne 0) { throw "EXE returned error $($proc.ExitCode)" }
            } finally {
              if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
              $env:ALFA_SMOKE_RESULT_PATH = ''
            }
            if (-not (Test-Path $report)) { throw "No smoke result: $exe" }
            $result = Get-Content $report -Raw | ConvertFrom-Json
            if (-not $result.ok -or $result.pages -ne 5 -or $result.books -lt 1) {
              throw "Invalid smoke report: $(Get-Content $report -Raw)"
            }
            Write-Host "Verified $($app[1]): $($result.books) books / $($result.pages) pages"
          }
      - name: Verify setup files and prepare release assets
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem output -File -Filter '*Setup*.exe')
          if ($setups.Count -ne 2) { throw 'Exactly two Windows setup files required' }
          $setups | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } |
            Set-Content -Encoding utf8 output\SHA256SUMS.txt
          Copy-Item .\ALFA_TEMIZ_KURULUM.ps1 output\ALFA_TEMIZ_KURULUM.ps1
          Copy-Item .\ALFA_TEMIZ_KURULUM.bat output\ALFA_TEMIZ_KURULUM.bat
      - uses: actions/upload-artifact@v4
        with:
          name: ALFA_ERP_V620_Windows_Installers
          path: output/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish tested installers as durable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          $source=Get-Content main.py -Raw
          if ($source -notmatch "VERSION='([^']+)'") { throw 'Missing VERSION' }
          $tag='v'+$Matches[1]
          $files=@(Get-ChildItem output -File | ForEach-Object { $_.FullName })
          gh release create $tag @files --repo '\${{ github.repository }}' --target '\${{ github.sha }}' --generate-notes --title "ALFA ERP $tag"
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
