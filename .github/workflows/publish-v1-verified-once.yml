name: Publish ALFA ERP v1.0.0 verified unified installer (one time)

on:
  push:
    branches: [firebase-rtdb-final]
    paths:
      - '.github/workflows/publish-v1-verified-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Publish verified v1.0.0 GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_RUN: '42085922315'
      VERIFIED_SHA: '942359e7ab9d0de57a18f2c5fbc3938652b47693'
    steps:
      - name: Confirm release is not already published
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$REPO" >/dev/null 2>&1; then
            echo 'v1.0.0 already exists: refusing to replace or republish.'
            exit 1
          fi
          if gh api "repos/$REPO/git/ref/tags/v1.0.0" >/dev/null 2>&1; then
            echo 'v1.0.0 tag already exists: refusing to overwrite.'
            exit 1
          fi
      - name: Verify exact approved source build
        shell: bash
        run: |
          set -euo pipefail
          status="$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.conclusion')"
          branch="$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.head_branch')"
          sha="$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.head_sha')"
          test "$status" = success
          test "$branch" = firebase-rtdb-final
          test "$sha" = "$VERIFIED_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: ALFA_ERP_V1_0_0_Unified_Setup
          run-id: 42085922315
          github-token: ${{ github.token }}
          path: ./release
      - name: Verify installer bytes and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          cd release
          test -s ALFA_ERP_Setup_V1_0_0.exe
          test -s SHA256SUMS.txt
          # PowerShell Set-Content writes CRLF on Windows; normalize only
          # checksum-list line endings before using GNU coreutils on Linux.
          sed -i 's/\r$//' SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 1
          test "$(awk '{print $2}' SHA256SUMS.txt)" = ALFA_ERP_Setup_V1_0_0.exe
          sha256sum -c SHA256SUMS.txt
      - name: Create permanent stable GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.0.0 \
            --repo "$REPO" \
            --target "$VERIFIED_SHA" \
            --title 'ALFA ERP v1.0 · Kararlı Windows sürümü' \
            --notes 'ALFA ERP v1.0.0 kararlı Windows sürümü. Tek Setup.exe içinde Personel/Yönetici seçimi; Yönetici kurulumu parola korumalıdır ve Firebase owner cihaz yetkisi ayrıca gereklidir. Firebase RTDB ortak sipariş havuzu, hata merkezi, olay bazlı senkronizasyon ve SHA-256 kontrollü güncelleme. v6.x sürümünden geçişte ilk kurulum elle yapılmalıdır. Kurulum öncesi yerel veri yedeği alın.' \
            ./release/ALFA_ERP_Setup_V1_0_0.exe \
            ./release/SHA256SUMS.txt
          gh release view v1.0.0 --repo "$REPO" --json tagName,isDraft,isPrerelease,assets,url
