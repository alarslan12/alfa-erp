name: Publish ALFA ERP stable release (manual, verified installers)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Run ID that built BOTH ALFA 6.6.0 Windows setups'
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify explicitly authorized release credentials
        env:
          GH_TOKEN: ${{ secrets.ALFA_RELEASE_TOKEN }}
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'Missing ALFA_RELEASE_TOKEN; need repo-scoped Contents: write and Workflows: write.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: ALFA_ERP_6_6_0_STABLE_INSTALLERS
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ./release
      - name: Verify both installers and their SHA256 values
        shell: bash
        run: |
          set -euo pipefail
          cd release
          test -s ALFA_ERP_Yonetici_Setup_V6_6_0.exe
          test -s ALFA_ERP_Personel_Setup_V6_6_0.exe
          test -s SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 2
      - name: Publish immutable stable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ALFA_RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          tag='v6.6.0'
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo 'Stable release already exists. Refusing to replace assets.'
            exit 1
          fi
          state="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.conclusion')"
          branch="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.head_branch')"
          source_sha="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.head_sha')"
          test "$state" = success
          test "$branch" = firebase-rtdb-final
          test -n "$source_sha"
          gh release create "$tag" \
            --repo "$REPO" --target "$source_sha" \
            --title 'ALFA ERP 6.6.0 · Stable Windows' \
            --notes 'Stable owner and staff Windows installers. On-error sanitized reports; owner-only event-driven Firebase inbox; SHA256-checked Update Center; original catalog/order/inventory workflows retained. Enable error report Security Rules using the separate guarded cutover tool. Windows device acceptance remains mandatory.' \
            ./release/ALFA_ERP_Yonetici_Setup_V6_6_0.exe \
            ./release/ALFA_ERP_Personel_Setup_V6_6_0.exe \
            ./release/SHA256SUMS.txt
