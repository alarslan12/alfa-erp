name: Publish ALFA ERP stable release (manual, verified installers)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful run ID with ALFA ERP v1.0 unified installer'
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify explicitly authorized release credentials
        env:
          GH_TOKEN: ${{ secrets.ALFA_RELEASE_TOKEN }}
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'Missing ALFA_RELEASE_TOKEN; need repo-scoped Contents: write and Workflows: write.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: ALFA_ERP_V1_0_0_Unified_Setup
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ./release
      - name: Verify unified installer and its SHA256 value
        shell: bash
        run: |
          set -euo pipefail
          cd release
          test -s ALFA_ERP_Setup_V1_0_0.exe
          test -s SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 1
      - name: Publish immutable stable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ALFA_RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          tag='v1.0.0'
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo 'Stable release already exists. Refusing to replace assets.'
            exit 1
          fi
          state="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.conclusion')"
          branch="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.head_branch')"
          source_sha="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.head_sha')"
          test "$state" = success
          test "$branch" = firebase-rtdb-final
          test -n "$source_sha"
          gh release create "$tag" \
            --repo "$REPO" --target "$source_sha" \
            --title 'ALFA ERP v1.0 · Kararlı Windows sürümü' \
            --notes 'Tek Windows kurulumu: Personel veya Yönetici seçilir. Yönetici kurulumu ayrı sabit parola kapısına, bulut işlemleri ayrıca Firebase owner cihaz yetkisine bağlıdır. Sipariş/katalog görünümü korunur; olay bazlı Hata Merkezi ve SHA-256 doğrulanan Güncelleme Merkezi içerir. Kurulum dosyası ilk 6.x sürümünden manuel indirilmelidir.' \
            ./release/ALFA_ERP_Setup_V1_0_0.exe \
            ./release/SHA256SUMS.txt
