name: Publish verified ALFA ERP v1.1.1 updater hotfix (once)

on:
  push:
    branches: [firebase-rtdb-final]
    paths:
      - '.github/workflows/publish-v111-verified-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Publish immutable v1.1.1 Windows updater repair
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_RUN: '42110492022'
      VERIFIED_SHA: '7906574c2be10dcb47f088e63a20806e9d5c9b83'
    steps:
      - name: Refuse to overwrite existing v1.1.1 release or tag
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.1.1 --repo "$REPO" >/dev/null 2>&1; then
            echo 'v1.1.1 already exists; refusing to modify.'
            exit 1
          fi
          if gh api "repos/$REPO/git/ref/tags/v1.1.1" >/dev/null 2>&1; then
            echo 'Tag v1.1.1 already exists; refusing to overwrite.'
            exit 1
          fi
      - name: Verify exact Windows build source and success
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.head_branch')" = firebase-rtdb-final
          test "$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.head_sha')" = "$VERIFIED_SHA"
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ALFA_ERP_V1_1_1_Unified_Setup
          run-id: 42110492022
          github-token: ${{ github.token }}
          path: ./release
      - name: Verify exact Setup.exe and SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release
          test -s ALFA_ERP_Setup_V1_1_1.exe
          test -s SHA256SUMS.txt
          sed -i 's/\r$//' SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 1
          test "$(awk '{print $2}' SHA256SUMS.txt)" = ALFA_ERP_Setup_V1_1_1.exe
          sha256sum -c SHA256SUMS.txt
      - name: Extract published hotfix changelog
        shell: bash
        run: |
          set -euo pipefail
          awk '/^## \[v1.1.1\]/{copy=1} /^## \[v1.1.0\]/{exit} copy{print}' CHANGELOG.md > release_notes.md
          test -s release_notes.md
      - name: Create permanent stable v1.1.1 release and confirm
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.1.1 \
            --repo "$REPO" \
            --target "$VERIFIED_SHA" \
            --title 'ALFA ERP v1.1.1 · Güncelleme Merkezi Düzeltmesi' \
            --notes-file release_notes.md \
            ./release/ALFA_ERP_Setup_V1_1_1.exe \
            ./release/SHA256SUMS.txt
          gh release view v1.1.1 --repo "$REPO" --json tagName,isDraft,isPrerelease,assets,url
