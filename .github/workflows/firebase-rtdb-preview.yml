name: ALFA ERP v1.0 Unified Windows installer build

on:
  push:
    branches: [firebase-rtdb-final]
    # Build only when release-critical Firebase code or this workflow changes.
    # No timer, no tests: syntax, packaging, Qt PDF import and installer hashes.
    paths:
      - '.github/workflows/firebase-rtdb-preview.yml'
      - 'alfa_hatalar.py'
      - 'alfa_rtdb.py'
      - 'firebase/database.rules.json'
      - 'tools/firebase_error_rules_cutover.py'
      - 'ALFA_BUILD_WINDOWS.ps1'
      - 'alfa_tek_kurulum.iss'
      - 'main.py'
      - 'alfa_guncelleme.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: One setup with staff/owner editions - syntax and bundled dependencies
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Compile Python source (syntax only; no tests)
        shell: pwsh
        run: |
          python -m compileall -q main.py alfa_rtdb.py rtdb_owner_admin.py firebase_pair_ui.py bulut_canli.py bildirim_servisi.py bildirim_sesleri.py pdf_kapak.py pdf_kitap.py widgets.py ekran_ayarlar.py ayar_yonetimi.py analytics_access.py yonetici_giris.py yonetici_kompakt.py ekran_envanter.py urun_katalogu.py inventory_batches.py alfa_hatalar.py hata_merkezi_ui.py alfa_guncelleme.py guncelleme_arayuzu.py tools/firebase_error_rules_cutover.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed' }
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 required' }
      - name: Package owner application files
        shell: pwsh
        run: .\ALFA_BUILD_WINDOWS.ps1 -Edition yonetici -SkipInstaller
      - name: Package staff application and notification service
        shell: pwsh
        run: .\ALFA_BUILD_WINDOWS.ps1 -Edition personel -SkipInstaller
      - name: Compile one edition-selectable Windows Setup
        shell: pwsh
        run: .\ALFA_BUILD_WINDOWS.ps1 -Edition ortak
      - name: Verify bundled Qt PDF dependency is importable
        shell: pwsh
        run: |
          & .\.buildvenv\Scripts\python.exe -c "from PySide6.QtPdf import QPdfDocument; print('QtPdf import OK')"
          if ($LASTEXITCODE -ne 0) { throw 'Missing official PySide6-Pdf module' }
      - name: Verify files and collect checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem .\output -Filter 'ALFA_ERP_Setup_V1_0_0.exe' -File)
          if ($files.Count -ne 1) { throw "Expected one unified Setup EXE; got $($files.Count)" }
          $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } |
            Set-Content -Path .\output\SHA256SUMS.txt -Encoding utf8
          Copy-Item .\firebase\RTDB_KURULUM.md .\output\RTDB_KURULUM.md
      - name: Upload checked unified installer binary
        uses: actions/upload-artifact@v4
        with:
          name: ALFA_ERP_V1_0_0_Unified_Setup
          path: |
            output/ALFA_ERP_Setup_V1_0_0.exe
            output/SHA256SUMS.txt
            output/RTDB_KURULUM.md
          if-no-files-found: error
          retention-days: 14

      - name: Explain stable installer distribution
        shell: pwsh
        run: |
          @'
          ## ALFA ERP v1.0 unified Windows installer successfully built
          One edition-selectable Setup.exe and SHA256SUMS.txt are in Artifacts.
          Sign in to GitHub to download Actions artifacts. These workflow artifacts expire after 14 days.
          A durable GitHub Release requires manual scoped repository authorization.
          It is intentionally not attempted by this preview build workflow.
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
