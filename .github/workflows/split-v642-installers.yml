name: Package verified ALFA ERP 6.4.2 installers separately

on:
  push:
    branches: [firebase-rtdb-final]
    paths: ['.github/workflows/split-v642-installers.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Retrieve already-built signed checksum assets (no rebuild)
        uses: actions/download-artifact@v4
        with:
          name: ALFA_ERP_Firebase_RTDB_V6_4_2_PREVIEW
          run-id: 42043091024
          github-token: ${{ github.token }}
          path: dist
      - name: Verify exact Windows installers from the source build
        shell: bash
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt
      - name: Package owner standalone installer
        uses: actions/upload-artifact@v4
        with:
          name: ALFA_ERP_Yonetici_V6_4_2_TekKurulum
          path: dist/ALFA_ERP_Yonetici_Setup_V6_4_2.exe
          if-no-files-found: error
          retention-days: 7
      - name: Package staff standalone installer
        uses: actions/upload-artifact@v4
        with:
          name: ALFA_ERP_Personel_V6_4_2_TekKurulum
          path: dist/ALFA_ERP_Personel_Setup_V6_4_2.exe
          if-no-files-found: error
          retention-days: 7
