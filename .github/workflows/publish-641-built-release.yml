name: Publish prebuilt ALFA ERP 6.4.1 RC2

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  publish:
    name: Publish binaries without a second Windows build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify explicitly authorized release credentials
        env:
          RELEASE_TOKEN: ${{ secrets.ALFA_RELEASE_TOKEN }}
        shell: bash
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Set a repository-only fine-grained ALFA_RELEASE_TOKEN secret with Contents: write and Workflows: write, or publish manually through the GitHub Releases UI."
            echo "Do NOT use the default Actions GITHUB_TOKEN for a release targeting a commit with workflow changes absent from the main branch."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: ALFA_ERP_Firebase_RTDB_V6_4_1_PREVIEW
          run-id: 42029816134
          github-token: ${{ github.token }}
          path: ./dist
      - name: Confirm downloaded installer files
        shell: bash
        run: |
          test -s ./dist/ALFA_ERP_Yonetici_Setup_V6_4_1.exe
          test -s ./dist/ALFA_ERP_Personel_Setup_V6_4_1.exe
          test -s ./dist/SHA256SUMS.txt
          cd dist
          sha256sum -c SHA256SUMS.txt
      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ALFA_RELEASE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          tag='v6.4.1-visual-sync-rc2'
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target 04d965d21eac01b5cdf50d5e76d66857e725e7b6 \
              --prerelease \
              --title 'ALFA ERP V6.4.1 Katalog, Envanter, Senkron ve Net Tema - RC2' \
              --notes 'Windows release candidate: numeric catalog sorting, General Products inside Inventory, stale-order sync repair, professional dark theme. Firebase production database unchanged. Device validation required.'
          fi
          gh release upload "$tag" \
            ./dist/ALFA_ERP_Yonetici_Setup_V6_4_1.exe \
            ./dist/ALFA_ERP_Personel_Setup_V6_4_1.exe \
            ./dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
