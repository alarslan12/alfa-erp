name: Publish verified ALFA ERP v1.1.0 stable unified installer (one time)

on:
  push:
    branches: [firebase-rtdb-final]
    paths:
      - '.github/workflows/publish-v110-verified-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish exact successful v1.1.0 Windows artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_RUN: '42102090226'
      VERIFIED_SHA: '7d2127c63b3e031d962faae1075b5c6ec2fa1619'
    steps:
      - name: Reject existing tag or release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.1.0 --repo "$REPO" >/dev/null 2>&1; then
            echo 'Already released; refusing to overwrite.'
            exit 1
          fi
          if gh api "repos/$REPO/git/ref/tags/v1.1.0" >/dev/null 2>&1; then
            echo 'Existing tag; refusing to overwrite.'
            exit 1
          fi
      - name: Verify exact previously successful Windows build
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.head_branch')" = firebase-rtdb-final
          test "$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.head_sha')" = "$VERIFIED_SHA"
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ALFA_ERP_V1_1_0_Unified_Setup
          run-id: 42102090226
          github-token: ${{ github.token }}
          path: ./release
      - name: Validate SHA-256, exact filename and changelog
        shell: bash
        run: |
          set -euo pipefail
          test -s release/ALFA_ERP_Setup_V1_1_0.exe
          test -s release/SHA256SUMS.txt
          sed -i 's/\r$//' release/SHA256SUMS.txt
          test "$(wc -l < release/SHA256SUMS.txt)" -eq 1
          test "$(awk '{print $2}' release/SHA256SUMS.txt)" = ALFA_ERP_Setup_V1_1_0.exe
          (cd release && sha256sum -c SHA256SUMS.txt)
          awk '/^## \[v1.1.0\]/{copy=1} /^## \[v1.0.0\]/{exit} copy{print}' CHANGELOG.md > release_notes.md
          test -s release_notes.md
      - name: Publish immutable v1.1.0 GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.1.0 \
            --repo "$REPO" \
            --target "$VERIFIED_SHA" \
            --title 'ALFA ERP v1.1.0 · İlk Resmî Güncelleme' \
            --notes-file release_notes.md \
            ./release/ALFA_ERP_Setup_V1_1_0.exe \
            ./release/SHA256SUMS.txt
          gh release view v1.1.0 --repo "$REPO" --json tagName,isDraft,isPrerelease,assets,url
