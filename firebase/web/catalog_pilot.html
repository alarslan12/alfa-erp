<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ALFA ERP · Firebase katalog önizlemesi</title>
  <style>
    :root { color-scheme:dark; font:16px/1.5 system-ui,"Segoe UI",sans-serif; background:#101a2d; color:#e9f2ff; }
    * {box-sizing:border-box} body{margin:0;min-height:100vh}
    header{padding:32px max(20px,calc((100vw - 1100px)/2));background:#172942;border-bottom:1px solid #34506d}
    h1{margin:0;font-size:clamp(24px,4vw,34px)} .sub{margin:6px 0 0;color:#adc3dc}
    main{max-width:1120px;margin:auto;padding:26px 20px}
    .meta{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
    #status{font-size:14px;color:#b2d2eb} #search{width:min(100%,420px);border-radius:12px;border:1px solid #53708f;background:#15243a;color:white;padding:13px;font:inherit}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}
    .book{border:1px solid #304d6d;background:#1a2d46;border-radius:16px;padding:16px}
    .code{font-size:12px;color:#7bdfe7;font-weight:700;letter-spacing:.05em} .name{display:block;margin:8px 0 12px;font-weight:650}
    .detail{font-size:14px;color:#adc3dc} .note{padding:13px 16px;border:1px solid #566582;border-radius:12px;background:#21283d;margin-bottom:25px;color:#d6e3f7}
    #empty{margin:14px 0;color:#b8d0e3} [hidden]{display:none!important}
  </style>
</head>
<body>
  <header>
    <h1>ALFA ERP <span style="color:#68d6dc">/ Firebase</span></h1>
    <p class="sub">Cloud Firestore katalog bağlantı önizlemesi · Canlı satış ekranı değildir</p>
  </header>
  <main>
    <div class="note"><strong>Geliştirme önizlemesi:</strong> Sipariş gönderimi bilinçli olarak kapalıdır.
    Supabase siparişleri bu sayfaya taşınmadı; mevcut mobil katalog ve Windows uygulamaları değişmedi.</div>
    <div class="meta">
      <div id="status" role="status" aria-live="polite">Firestore bağlantısı hazırlanıyor…</div>
      <input id="search" type="search" placeholder="Kitap adı, kodu veya kategori ara" aria-label="Kitap ara">
    </div>
    <p id="empty" hidden></p>
    <section id="catalog" class="grid" aria-label="Firestore kitap kataloğu"></section>
  </main>
  <script type="module" src="./catalog_pilot.js"></script>
</body>
</html>
